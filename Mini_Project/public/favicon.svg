<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B1A2B" />
      <stop offset="100%" stop-color="#5E111D" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5A623" />
      <stop offset="100%" stop-color="#F7B731" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Shield/Card -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)" />
  <rect x="40" y="40" width="432" height="432" rx="88" fill="none" stroke="#1E3A66" stroke-width="12" stroke-opacity="0.6"/>
  
  <!-- Campus Pillars / Building Motif -->
  <g filter="url(#glow)">
    <!-- Central Roof Dome -->
    <path d="M 256 128 L 180 180 L 332 180 Z" fill="url(#goldGrad)" />
    <!-- Pillars -->
    <rect x="196" y="196" width="24" height="120" rx="4" fill="#FFFFFF" />
    <rect x="244" y="196" width="24" height="120" rx="4" fill="#FFFFFF" />
    <rect x="292" y="196" width="24" height="120" rx="4" fill="#FFFFFF" />
    <!-- Base -->
    <rect x="172" y="316" width="168" height="20" rx="6" fill="#FFFFFF" />
    
    <!-- Fix Badge -->
    <circle cx="340" cy="320" r="64" fill="#1E3A66" stroke="#FFFFFF" stroke-width="8"/>
    <!-- Checkmark Icon -->
    <path d="M 312 320 L 332 340 L 372 296" fill="none" stroke="#F5A623" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
